version: '3.9'

services:
  # Neon Local proxy for ephemeral development branches
  neon-local:
    image: neondatabase/neon_local:latest
    container_name: devops-acquisitions-neon-local
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    volumes:
      # Optional: Persist metadata for branch detection per Git branch
      - ./.neon_local:/tmp/.neon_local
      - ./.git/HEAD:/tmp/.git/HEAD:ro,consistent
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "neon", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-acquisitions-app
    depends_on:
      neon-local:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    volumes:
      # Mount source code for development hot-reload
      - .:/app
      - /app/node_modules
      # Mount logs directory
      - ./logs:/app/logs
      # Hot-reload for development (optional)
      - ./drizzle.config.js:/app/drizzle.config.js
    networks:
      - dev-network
    restart: unless-stopped
    command: npm run dev

networks:
  dev-network:
    driver: bridge
