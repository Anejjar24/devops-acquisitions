version: '3.9'

services:
  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: devops-acquisitions-app-prod
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    volumes:
      # Mount logs directory for production logging
      - ./logs:/app/logs
    networks:
      - prod-network
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000), (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  prod-network:
    driver: bridge
